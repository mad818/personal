    <rect class="ember" x="25" y="17" width="5" height="6"/>
    <rect class="dark" x="20" y="41" width="9" height="3"/>
  </g>

  <g id="mace" transform="translate(192 0)">
    <rect class="bronze" x="22" y="13" width="5" height="29"/>
    <rect class="steel" x="17" y="7" width="16" height="13"/>
    <rect class="amber" x="15" y="10" width="20" height="4"/>
    <rect class="dark" x="20" y="40" width="9" height="3"/>
  </g>

  <g id="hammer" transform="translate(240 0)">
