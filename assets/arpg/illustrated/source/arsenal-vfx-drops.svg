      <path d="M64 39 V90 M47 64 H81" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
    </symbol>
  </defs>
  <g color="#c9a46a" transform="translate(0 0)"><use href="#burst"/></g>
  <g color="#90be6d" transform="translate(128 0)"><use href="#burst"/></g>
  <g color="#ffd166" transform="translate(256 0)"><use href="#beam"/></g>
  <g color="#d946ef" transform="translate(384 0)"><use href="#beam"/></g>
