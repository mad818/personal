<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-labelledby="akTitle akDesc">
  <title id="akTitle">API keys layout</title>
  <desc id="akDesc">Nexus token, AI providers, optional data keys</desc>
  <defs>
    <linearGradient id="akBg" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0708"/><stop offset="100%" style="stop-color:#120d0f"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="260" rx="14" fill="url(#akBg)" stroke="#c4485a" stroke-opacity="0.28" stroke-width="1"/>
  <text x="500" y="32" text-anchor="middle" fill="#e8ddd0" font-family="system-ui,sans-serif" font-size="12" font-weight="800" letter-spacing="0.2em">API KEYS</text>
  <text x="500" y="50" text-anchor="middle" fill="#887b7f" font-family="system-ui,sans-serif" font-size="9">All optional for feeds / graceful empty panels | Set in .env.local or Settings</text>
  <line x1="48" y1="60" x2="952" y2="60" stroke="#c4485a" stroke-opacity="0.25" stroke-width="1"/>

  <g font-family="system-ui,sans-serif">
    <rect x="32" y="78" width="280" height="164" rx="10" fill="#141011" stroke="#f59e0b" stroke-opacity="0.45"/>
    <text x="172" y="102" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="800">REQUIRED FOR /api/*</text>
    <text x="172" y="124" text-anchor="middle" fill="#d4c4b8" font-size="9">NEXUS_TOKEN</text>
    <text x="172" y="142" text-anchor="middle" fill="#6b7280" font-size="8">Any secret string</text>
    <text x="172" y="168" text-anchor="middle" fill="#887b7f" font-size="8">Browser sends Bearer token</text>
    <text x="172" y="186" text-anchor="middle" fill="#887b7f" font-size="8">to match this value</text>

    <rect x="328" y="78" width="312" height="164" rx="10" fill="#141011" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="484" y="102" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="800">AI (SERVER .env)</text>
    <text x="484" y="122" text-anchor="middle" fill="#a7f3d0" font-size="8.5">ANTHROPIC_API_KEY</text>
    <text x="484" y="138" text-anchor="middle" fill="#a7f3d0" font-size="8.5">MINIMAX_API_KEY</text>
    <text x="484" y="154" text-anchor="middle" fill="#a7f3d0" font-size="8.5">OPENAI_API_KEY</text>
    <text x="484" y="170" text-anchor="middle" fill="#6b7280" font-size="8">GROQ OPENROUTER GOOGLE_AI</text>
    <text x="484" y="190" text-anchor="middle" fill="#887b7f" font-size="8">Auto chain skips missing keys</text>
    <text x="484" y="208" text-anchor="middle" fill="#887b7f" font-size="8">Never sent to browser raw</text>

    <rect x="656" y="78" width="312" height="164" rx="10" fill="#141011" stroke="#7c3aed" stroke-opacity="0.4"/>
    <text x="812" y="102" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="800">DATA + INTEL</text>
    <text x="812" y="122" text-anchor="middle" fill="#a8a29e" font-size="8">COINGECKO FINNHUB NVD OTX</text>
    <text x="812" y="138" text-anchor="middle" fill="#a8a29e" font-size="8">GUARDIAN FRED AISSTREAM</text>
    <text x="812" y="154" text-anchor="middle" fill="#a8a29e" font-size="8">FIRMS_MAP FIRECRAWL BRAVE</text>
    <text x="812" y="178" text-anchor="middle" fill="#887b7f" font-size="8">See .env.example</text>
    <text x="812" y="194" text-anchor="middle" fill="#887b7f" font-size="8">for full list + links</text>
  </g>
</svg>
