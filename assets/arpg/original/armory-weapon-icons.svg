<svg xmlns="http://www.w3.org/2000/svg" width="336" height="144" viewBox="0 0 336 144" shape-rendering="crispEdges">
  <defs>
    <style>
      .bronze { fill: #c9863f; }
      .amber { fill: #ffd166; }
      .dark { fill: #28180e; }
      .iron { fill: #d8c7a1; }
      .steel { fill: #f7e9c7; }
      .ember { fill: #f26d3d; }
      .green { fill: #8dbf67; }
      .blue { fill: #8ecae6; }
      .shadow { fill: #120b08; opacity: .75; }
      .line { fill: none; stroke: #120b08; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; }
    </style>
  </defs>

  <g id="one-hand-sword" transform="translate(0 0)">
    <rect class="shadow" x="22" y="10" width="4" height="26"/>
    <polygon class="steel" points="24,4 31,15 26,34 22,34 17,15"/>
    <rect class="amber" x="16" y="31" width="16" height="4"/>
    <rect class="bronze" x="22" y="35" width="4" height="8"/>
    <rect class="dark" x="19" y="41" width="10" height="3"/>
  </g>

  <g id="two-hand-sword" transform="translate(48 0)">
    <polygon class="steel" points="24,2 32,18 28,37 20,37 16,18"/>
    <rect class="amber" x="13" y="34" width="22" height="4"/>
    <rect class="bronze" x="22" y="38" width="4" height="8"/>
    <rect class="dark" x="17" y="44" width="14" height="3"/>
    <rect class="ember" x="22" y="12" width="4" height="18"/>
  </g>

  <g id="dagger" transform="translate(96 0)">
