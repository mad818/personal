<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 318" width="1000" height="318" role="img" aria-labelledby="qT qD">
  <title id="qT">Quickstart</title>
  <desc id="qD">Clone install env run open verify PWA</desc>
  <defs>
    <linearGradient id="qBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0708"/><stop offset="100%" style="stop-color:#140f12"/>
    </linearGradient>
    <linearGradient id="qLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c4485a"/><stop offset="100%" style="stop-color:#d4a56a"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="318" rx="16" fill="url(#qBg)" stroke="#c4485a" stroke-opacity="0.35" stroke-width="1"/>
  <path d="M 18 18 L 44 18 M 18 18 L 18 44" stroke="#c4485a" stroke-opacity="0.28" fill="none"/>
  <path d="M 982 18 L 956 18 M 982 18 L 982 44" stroke="#c4485a" stroke-opacity="0.28" fill="none"/>

  <text x="500" y="36" text-anchor="middle" fill="#e8ddd0" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="800" letter-spacing="0.36em">QUICKSTART</text>
  <line x1="100" y1="48" x2="900" y2="48" stroke="url(#qLine)" stroke-opacity="0.6" stroke-width="1"/>
  <text x="500" y="64" text-anchor="middle" fill="#6b5f63" font-family="system-ui,sans-serif" font-size="8">From zero to localhost in five beats | then verify and optional PWA</text>

  <!-- flow connectors -->
  <path d="M 178 138 L 198 138" stroke="#4b5563" stroke-width="1.2" fill="none"/>
  <polygon points="198,138 190,133 190,143" fill="#5c5356"/>
  <path d="M 362 138 L 382 138" stroke="#4b5563" stroke-width="1.2" fill="none"/>
  <polygon points="382,138 374,133 374,143" fill="#5c5356"/>
  <path d="M 546 138 L 566 138" stroke="#4b5563" stroke-width="1.2" fill="none"/>
  <polygon points="566,138 558,133 558,143" fill="#5c5356"/>
  <path d="M 730 138 L 750 138" stroke="#4b5563" stroke-width="1.2" fill="none"/>
  <polygon points="750,138 742,133 742,143" fill="#5c5356"/>

  <g font-family="ui-monospace,Consolas,monospace">
    <g transform="translate(14,78)">
      <rect width="164" height="120" rx="10" fill="#141011" stroke="#34d399" stroke-opacity="0.45"/>
      <circle cx="22" cy="22" r="12" fill="#065f46" fill-opacity="0.4" stroke="#34d399" stroke-width="1"/>
      <text x="22" y="26" text-anchor="middle" fill="#a7f3d0" font-family="system-ui,sans-serif" font-size="10" font-weight="800">1</text>
      <text x="92" y="24" text-anchor="middle" fill="#6ee7b7" font-family="system-ui,sans-serif" font-size="9" font-weight="700">CLONE</text>
      <text x="82" y="48" text-anchor="middle" fill="#c4b4b8" font-size="7">git clone &lt;internal-url&gt;</text>
      <text x="82" y="60" text-anchor="middle" fill="#c4b4b8" font-size="7">project.git</text>
      <text x="82" y="78" text-anchor="middle" fill="#9a8b90" font-size="7">cd &lt;project&gt;</text>
    </g>
    <g transform="translate(198,78)">
      <rect width="164" height="120" rx="10" fill="#141011" stroke="#60a5fa" stroke-opacity="0.45"/>
      <circle cx="22" cy="22" r="12" fill="#1e3a5f" fill-opacity="0.5" stroke="#60a5fa" stroke-width="1"/>
      <text x="22" y="26" text-anchor="middle" fill="#bfdbfe" font-family="system-ui,sans-serif" font-size="10" font-weight="800">2</text>
      <text x="92" y="24" text-anchor="middle" fill="#93c5fd" font-family="system-ui,sans-serif" font-size="9" font-weight="700">INSTALL</text>
      <text x="82" y="56" text-anchor="middle" fill="#c4b4b8" font-size="9">npm install</text>
    </g>
    <g transform="translate(382,78)">
      <rect width="164" height="120" rx="10" fill="#141011" stroke="#d4a56a" stroke-opacity="0.5"/>
      <circle cx="22" cy="22" r="12" fill="#78350f" fill-opacity="0.35" stroke="#d4a56a" stroke-width="1"/>
      <text x="22" y="26" text-anchor="middle" fill="#fcd34d" font-family="system-ui,sans-serif" font-size="10" font-weight="800">3</text>
      <text x="82" y="24" text-anchor="middle" fill="#f0d9a8" font-family="system-ui,sans-serif" font-size="9" font-weight="700">ENV</text>
      <text x="82" y="46" text-anchor="middle" fill="#c4b4b8" font-size="7">cp .env.example</text>
      <text x="82" y="58" text-anchor="middle" fill="#c4b4b8" font-size="7">.env.local</text>
      <rect x="12" y="68" width="140" height="40" rx="4" fill="#0c0a0b" stroke="#57534e" stroke-opacity="0.5"/>
      <text x="82" y="82" text-anchor="middle" fill="#86efac" font-size="6.5">NEXUS_TOKEN=...</text>
      <text x="82" y="94" text-anchor="middle" fill="#86efac" font-size="6.5">ANTHROPIC_API_KEY=...</text>
      <text x="82" y="108" text-anchor="middle" fill="#6b5f63" font-size="6">or Local AI path</text>
    </g>
    <g transform="translate(566,78)">
      <rect width="164" height="120" rx="10" fill="#141011" stroke="#c4485a" stroke-opacity="0.5"/>
      <circle cx="22" cy="22" r="12" fill="#7f1d1d" fill-opacity="0.35" stroke="#fb7185" stroke-width="1"/>
      <text x="22" y="26" text-anchor="middle" fill="#fda4af" font-family="system-ui,sans-serif" font-size="10" font-weight="800">4</text>
      <text x="92" y="24" text-anchor="middle" fill="#f5d0d6" font-family="system-ui,sans-serif" font-size="9" font-weight="700">RUN</text>
      <text x="82" y="56" text-anchor="middle" fill="#c4b4b8" font-size="9">npm run dev</text>
    </g>
    <g transform="translate(750,78)">
      <rect width="236" height="120" rx="10" fill="#141011" stroke="#a78bfa" stroke-opacity="0.45"/>
      <circle cx="22" cy="22" r="12" fill="#4c1d95" fill-opacity="0.35" stroke="#c4b5fd" stroke-width="1"/>
      <text x="22" y="26" text-anchor="middle" fill="#ddd6fe" font-family="system-ui,sans-serif" font-size="10" font-weight="800">5</text>
      <text x="128" y="24" text-anchor="middle" fill="#e9e0ff" font-family="system-ui,sans-serif" font-size="9" font-weight="700">OPEN + PWA</text>
      <text x="128" y="48" text-anchor="middle" fill="#c4b4b8" font-size="8.5">http://localhost:3000</text>
      <text x="128" y="66" text-anchor="middle" fill="#7d7175" font-size="7">Chrome Edge: Install</text>
      <text x="128" y="78" text-anchor="middle" fill="#7d7175" font-size="7">Safari: Add to Home</text>
      <text x="128" y="96" text-anchor="middle" fill="#6b5f63" font-size="6.5">manifest.json + icon.svg</text>
    </g>
  </g>

  <rect x="48" y="214" width="904" height="88" rx="10" fill="#0d0a0b" stroke="#374151" stroke-opacity="0.6"/>
  <text x="500" y="236" text-anchor="middle" fill="#9ca3af" font-family="system-ui,sans-serif" font-size="9" font-weight="700">QUALITY + GRACEFUL DEGRADE</text>
  <text x="500" y="256" text-anchor="middle" fill="#6b7280" font-family="ui-monospace,monospace" font-size="8">npm run verify</text>
  <text x="500" y="272" text-anchor="middle" fill="#7d7175" font-family="system-ui,sans-serif" font-size="8">type-check + lint + path safety | missing data keys only hide that feed</text>
  <text x="500" y="290" text-anchor="middle" fill="#5c5356" font-family="system-ui,sans-serif" font-size="7.5">Full variable list and signup URLs live in .env.example</text>
</svg>
