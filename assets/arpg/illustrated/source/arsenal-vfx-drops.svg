      <path d="M64 16 L78 64 L64 112 L50 64 Z" fill="currentColor" fill-opacity=".55" stroke="#fff4dc" stroke-opacity=".45" stroke-width="2"/>
      <circle cx="64" cy="64" r="34" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width="5"/>
    </symbol>
    <symbol id="spark" viewBox="0 0 128 128">
