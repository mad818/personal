<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-labelledby="loTitle loDesc">
  <title id="loTitle">Local AI offline path</title>
  <desc id="loDesc">Ollama pull, serve, Nexus settings for local endpoint</desc>
  <defs>
    <linearGradient id="loBg" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0708"/><stop offset="100%" style="stop-color:#0f1612"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="200" rx="14" fill="url(#loBg)" stroke="#10b981" stroke-opacity="0.35" stroke-width="1"/>
  <text x="500" y="34" text-anchor="middle" fill="#d1fae5" font-family="system-ui,sans-serif" font-size="12" font-weight="800" letter-spacing="0.18em">LOCAL AI / FULLY OFFLINE</text>
  <text x="500" y="52" text-anchor="middle" fill="#6b9080" font-family="system-ui,sans-serif" font-size="9">No Anthropic MiniMax or OpenAI required | Data for maps still uses public APIs unless you disable layers</text>
  <line x1="48" y1="62" x2="952" y2="62" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>

  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#a7f3d0">
    <rect x="40" y="82" width="280" height="96" rx="10" fill="#141011" stroke="#10b981" stroke-opacity="0.35"/>
    <text x="180" y="108" text-anchor="middle" fill="#6ee7b7" font-family="system-ui,sans-serif" font-size="10" font-weight="700">TERMINAL</text>
    <text x="180" y="132" text-anchor="middle">ollama pull qwen3:8b</text>
    <text x="180" y="152" text-anchor="middle" font-size="9" fill="#6b9080">ollama serve (default)</text>

    <text x="338" y="134" fill="#4b5563" font-size="20" font-family="system-ui">&gt;</text>

    <rect x="368" y="82" width="320" height="96" rx="10" fill="#141011" stroke="#34d399" stroke-opacity="0.35"/>
    <text x="528" y="108" text-anchor="middle" fill="#6ee7b7" font-family="system-ui,sans-serif" font-size="10" font-weight="700">NEXUS SETTINGS</text>
    <text x="528" y="130" text-anchor="middle" font-size="9">Endpoint:</text>
    <text x="528" y="148" text-anchor="middle" font-size="8" fill="#86efac">localhost:11434/v1/chat/completions</text>

    <text x="706" y="134" fill="#4b5563" font-size="20" font-family="system-ui">&gt;</text>

    <rect x="736" y="82" width="224" height="96" rx="10" fill="#141011" stroke="#059669" stroke-opacity="0.45"/>
    <text x="848" y="108" text-anchor="middle" fill="#a7f3d0" font-family="system-ui,sans-serif" font-size="10" font-weight="700">LOCAL MODE</text>
    <text x="848" y="128" text-anchor="middle" font-size="9">Provider: Local</text>
    <text x="848" y="146" text-anchor="middle" font-size="8" fill="#86efac">Model: qwen3:8b (example)</text>
    <text x="848" y="162" text-anchor="middle" font-size="8" fill="#6b9080">No cloud API key</text>
  </g>
  <text x="500" y="188" text-anchor="middle" fill="#5c5356" font-family="system-ui,sans-serif" font-size="9">Task routing: lib/aiModelRouting.ts maps chat code vision to Ollama model ids</text>
</svg>
