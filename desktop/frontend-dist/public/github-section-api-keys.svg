<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="aT aD">
  <title id="aT">API keys BYOK</title>
  <desc id="aD">Nexus token AI providers data keys server only</desc>
  <defs>
    <linearGradient id="aBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0708"/><stop offset="100%" style="stop-color:#120d0f"/>
    </linearGradient>
    <linearGradient id="aAc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c4485a"/><stop offset="100%" style="stop-color:#d4a56a"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="400" rx="16" fill="url(#aBg)" stroke="#c4485a" stroke-opacity="0.32" stroke-width="1"/>
  <path d="M 20 20 L 46 20 M 20 20 L 20 46 M 980 20 L 954 20 M 980 20 L 980 46" stroke="#c4485a" stroke-opacity="0.22" fill="none"/>

  <text x="500" y="34" text-anchor="middle" fill="#e8ddd0" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="800" letter-spacing="0.34em">API KEYS</text>
  <line x1="80" y1="44" x2="920" y2="44" stroke="url(#aAc)" stroke-opacity="0.55" stroke-width="1"/>
  <text x="500" y="60" text-anchor="middle" fill="#7d7175" font-family="system-ui,sans-serif" font-size="8">Bring your own keys | Server holds secrets | Browser sends only NEXUS_TOKEN as Bearer</text>

  <!-- Column 1 -->
  <rect x="24" y="76" width="300" height="300" rx="12" fill="#141011" stroke="#f59e0b" stroke-opacity="0.4"/>
  <text x="174" y="98" text-anchor="middle" fill="#fcd34d" font-family="system-ui,sans-serif" font-size="10" font-weight="800">GATE</text>
  <text x="174" y="114" text-anchor="middle" fill="#9a8b90" font-size="7.5">Required to call /api/*</text>
  <rect x="40" y="124" width="268" height="36" rx="6" fill="#1c1410" stroke="#b45309" stroke-opacity="0.35"/>
  <text x="174" y="146" text-anchor="middle" fill="#fef3c7" font-family="ui-monospace,monospace" font-size="9" font-weight="700">NEXUS_TOKEN</text>
  <text x="174" y="176" text-anchor="middle" fill="#6b5f63" font-size="7.5">Any strong random string</text>
  <line x1="40" y1="192" x2="292" y2="192" stroke="#44403c" stroke-opacity="0.5"/>
  <text x="174" y="212" text-anchor="middle" fill="#78716c" font-family="system-ui,sans-serif" font-size="7">Authorization: Bearer</text>
  <text x="174" y="228" text-anchor="middle" fill="#78716c" font-family="system-ui,sans-serif" font-size="7">must match this value</text>
  <text x="174" y="356" text-anchor="middle" fill="#5c5356" font-size="7">Ollama local needs no cloud key</text>

  <!-- Column 2 AI -->
  <rect x="336" y="76" width="312" height="300" rx="12" fill="#141011" stroke="#34d399" stroke-opacity="0.38"/>
  <text x="492" y="98" text-anchor="middle" fill="#6ee7b7" font-family="system-ui,sans-serif" font-size="10" font-weight="800">AI PROVIDERS</text>
  <text x="492" y="114" text-anchor="middle" fill="#9a8b90" font-size="7.5">Chain tries in order | skips missing</text>
  <g font-family="ui-monospace,monospace" font-size="7" fill="#a7f3d0">
    <text x="352" y="132">ANTHROPIC_API_KEY</text><text x="352" y="144" fill="#57534e" font-size="6">console.anthropic.com</text>
    <text x="352" y="160">MINIMAX_API_KEY</text><text x="352" y="172" fill="#57534e" font-size="6">platform.minimax.io</text>
    <text x="352" y="188">OPENAI_API_KEY</text><text x="352" y="200" fill="#57534e" font-size="6">platform.openai.com</text>
    <text x="352" y="216">GROQ_API_KEY</text><text x="352" y="228" fill="#57534e" font-size="6">console.groq.com</text>
    <text x="352" y="244">OPENROUTER_API_KEY</text><text x="352" y="256" fill="#57534e" font-size="6">openrouter.ai</text>
    <text x="352" y="272">GOOGLE_AI_KEY</text><text x="352" y="284" fill="#57534e" font-size="6">aistudio.google.com</text>
  </g>
  <text x="492" y="358" text-anchor="middle" fill="#5c5356" font-size="6.5">Never exposed to client bundles</text>

  <!-- Column 3 DATA -->
  <rect x="660" y="76" width="316" height="300" rx="12" fill="#141011" stroke="#7c3aed" stroke-opacity="0.38"/>
  <text x="818" y="98" text-anchor="middle" fill="#c4b5fd" font-family="system-ui,sans-serif" font-size="10" font-weight="800">DATA + INTEL</text>
  <text x="818" y="114" text-anchor="middle" fill="#9a8b90" font-size="7.5">All optional | panels go quiet if absent</text>
  <g font-family="ui-monospace,monospace" font-size="6.5" fill="#d6d3d1">
    <text x="676" y="130">COINGECKO_KEY</text><text x="676" y="142" fill="#57534e" font-size="5.5">coingecko.com/api</text>
    <text x="676" y="156">FINNHUB_KEY</text><text x="676" y="168" fill="#57534e" font-size="5.5">finnhub.io</text>
    <text x="676" y="182">GUARDIAN_KEY</text><text x="676" y="194" fill="#57534e" font-size="5.5">theguardian.com open-platform</text>
    <text x="676" y="208">FRED_KEY</text><text x="676" y="220" fill="#57534e" font-size="5.5">fred.stlouisfed.org</text>
    <text x="676" y="234">OTX_KEY</text><text x="676" y="246" fill="#57534e" font-size="5.5">otx.alienvault.com</text>
    <text x="676" y="260">NVD_KEY</text><text x="676" y="272" fill="#57534e" font-size="5.5">nvd.nist.gov developers</text>
    <text x="676" y="286">FIRECRAWL_KEY</text><text x="676" y="298" fill="#57534e" font-size="5.5">firecrawl.dev</text>
    <text x="820" y="130">BRAVE_SEARCH_KEY</text><text x="820" y="142" fill="#57534e" font-size="5.5">api.search.brave.com</text>
    <text x="820" y="156">AISSTREAM_KEY</text><text x="820" y="168" fill="#57534e" font-size="5.5">aisstream.io</text>
    <text x="820" y="182">FIRMS_MAP_KEY</text><text x="820" y="194" fill="#57534e" font-size="5.5">NASA FIRMS API</text>
  </g>
  <text x="818" y="356" text-anchor="middle" fill="#5c5356" font-size="7">Canonical copy: .env.example in repo root</text>
</svg>
