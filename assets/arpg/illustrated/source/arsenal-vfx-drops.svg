<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="128" viewBox="0 0 1536 128">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <symbol id="burst" viewBox="0 0 128 128">
      <circle cx="64" cy="64" r="45" fill="currentColor" fill-opacity=".12" filter="url(#glow)"/>
      <circle cx="64" cy="64" r="23" fill="currentColor" fill-opacity=".18"/>
      <path d="M64 13 L72 52 L111 64 L72 76 L64 115 L56 76 L17 64 L56 52 Z" fill="currentColor" fill-opacity=".45" stroke="#fff4dc" stroke-opacity=".38" stroke-width="2"/>
    </symbol>
    <symbol id="beam" viewBox="0 0 128 128">
