<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 268" width="1000" height="268" role="img" aria-labelledby="lT lD">
  <title id="lT">Local AI offline</title>
  <desc id="lD">Ollama settings endpoint model routing</desc>
  <defs>
    <linearGradient id="lBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f0d"/><stop offset="100%" style="stop-color:#0c1210"/>
    </linearGradient>
    <linearGradient id="lAc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/><stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="268" rx="16" fill="url(#lBg)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
  <path d="M 20 248 L 46 248 M 20 248 L 20 222 M 980 248 L 954 248 M 980 248 L 980 222" stroke="#10b981" stroke-opacity="0.2" fill="none"/>

  <text x="500" y="34" text-anchor="middle" fill="#d1fae5" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="800" letter-spacing="0.28em">LOCAL AI / OFFLINE</text>
  <line x1="120" y1="46" x2="880" y2="46" stroke="url(#lAc)" stroke-opacity="0.5" stroke-width="1"/>
  <text x="500" y="62" text-anchor="middle" fill="#6b9080" font-family="system-ui,sans-serif" font-size="8">Cloud LLM keys optional | Agent runs on Ollama OpenAI-compatible API</text>

  <path d="M 288 142 C 320 142 320 142 348 142" stroke="#4b5563" fill="none" stroke-width="1.2"/>
  <polygon points="348,142 338,137 338,147" fill="#6b7280"/>
  <path d="M 628 142 C 660 142 660 142 688 142" stroke="#4b5563" fill="none" stroke-width="1.2"/>
  <polygon points="688,142 678,137 678,147" fill="#6b7280"/>

  <g>
    <rect x="32" y="84" width="256" height="116" rx="12" fill="#141011" stroke="#059669" stroke-opacity="0.5"/>
    <text x="160" y="108" text-anchor="middle" fill="#6ee7b7" font-family="system-ui,sans-serif" font-size="10" font-weight="800">HOST</text>
    <text x="160" y="128" text-anchor="middle" fill="#a7f3d0" font-family="ui-monospace,monospace" font-size="8.5">ollama pull qwen3:8b</text>
    <text x="160" y="148" text-anchor="middle" fill="#6b9080" font-family="ui-monospace,monospace" font-size="7.5">ollama serve</text>
    <text x="160" y="168" text-anchor="middle" fill="#57534e" font-size="7">default :11434</text>
    <text x="160" y="186" text-anchor="middle" fill="#57534e" font-size="6.5">swap model id as you like</text>

    <rect x="352" y="84" width="276" height="116" rx="12" fill="#141011" stroke="#34d399" stroke-opacity="0.45"/>
    <text x="490" y="108" text-anchor="middle" fill="#6ee7b7" font-family="system-ui,sans-serif" font-size="10" font-weight="800">ENDPOINT</text>
    <text x="490" y="132" text-anchor="middle" fill="#86efac" font-family="ui-monospace,monospace" font-size="7">http://localhost:11434</text>
    <text x="490" y="146" text-anchor="middle" fill="#86efac" font-family="ui-monospace,monospace" font-size="7">/v1/chat/completions</text>
    <text x="490" y="168" text-anchor="middle" fill="#78716c" font-size="7">Paste in Settings</text>
    <text x="490" y="184" text-anchor="middle" fill="#78716c" font-size="7">when Provider = Local</text>

    <rect x="692" y="84" width="276" height="116" rx="12" fill="#141011" stroke="#10b981" stroke-opacity="0.45"/>
    <text x="830" y="108" text-anchor="middle" fill="#a7f3d0" font-family="system-ui,sans-serif" font-size="10" font-weight="800">MODEL + ROUTING</text>
    <text x="830" y="132" text-anchor="middle" fill="#d1fae5" font-family="ui-monospace,monospace" font-size="8">qwen3:8b (example)</text>
    <text x="830" y="152" text-anchor="middle" fill="#78716c" font-size="7">lib/aiModelRouting.ts</text>
    <text x="830" y="168" text-anchor="middle" fill="#78716c" font-size="7">chat / code / vision maps</text>
    <text x="830" y="186" text-anchor="middle" fill="#57534e" font-size="6.5">No cloud API key for agent</text>
  </g>

  <rect x="48" y="212" width="904" height="44" rx="8" fill="#0d1210" stroke="#14532d" stroke-opacity="0.4"/>
  <text x="500" y="232" text-anchor="middle" fill="#9ca3af" font-family="system-ui,sans-serif" font-size="7.5">Public feeds for maps and news still use the network | use Local AI for privacy on the LLM path only</text>
  <text x="500" y="248" text-anchor="middle" fill="#5c5356" font-size="6.5">See also API Keys panel for optional data keys</text>
</svg>
