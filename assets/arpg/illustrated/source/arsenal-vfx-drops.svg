  <g color="#c9a46a" transform="translate(1152 0)"><circle cx="64" cy="72" r="36" fill="currentColor" fill-opacity=".16"/><path d="M28 82 C50 104 78 104 100 82" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/><circle cx="45" cy="54" r="6" fill="#fff4dc"/><circle cx="64" cy="42" r="8" fill="#fff4dc"/><circle cx="84" cy="57" r="5" fill="#fff4dc"/></g>
