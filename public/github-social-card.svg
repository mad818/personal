<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="ogtitle ogdesc">
  <title id="ogtitle">Aegis Vector - repository social preview</title>
  <desc id="ogdesc">Title, tagline, and keywords for Open Graph / GitHub social image</desc>
  <defs>
    <linearGradient id="ogbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#040a10"/>
      <stop offset="55%" style="stop-color:#09131d"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="ogline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0"/>
      <stop offset="40%" style="stop-color:#22d3ee"/>
      <stop offset="60%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="ogglow" cx="85%" cy="20%" r="45%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0.14"/>
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#ogbg)"/>
  <rect width="1280" height="640" fill="url(#ogglow)"/>
  <line x1="120" y1="420" x2="1160" y2="420" stroke="url(#ogline)" stroke-width="2"/>

  <text x="120" y="200" fill="#ecfeff" font-family="system-ui,Segoe UI,sans-serif" font-size="72" font-weight="900" letter-spacing="-0.02em">AEGIS VECTOR</text>
  <text x="124" y="268" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="22" font-weight="700" letter-spacing="0.42em">COMMAND INTELLIGENCE</text>
  <text x="120" y="340" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="28" font-weight="500">Local-first / Markets / Recon / Cyber / Desktop / Free-first AI</text>

  <g font-family="system-ui,sans-serif" font-size="20" font-weight="700">
    <text x="120" y="500" fill="#f59e0b">MIT</text>
    <text x="220" y="500" fill="#6b7280">+</text>
    <text x="248" y="500" fill="#a8a29e">Next.js 14</text>
    <text x="420" y="500" fill="#6b7280">+</text>
    <text x="448" y="500" fill="#a8a29e">Free-first APIs</text>
    <text x="620" y="500" fill="#6b7280">+</text>
    <text x="648" y="500" fill="#a8a29e">Ollama / Groq / Optional BYOK</text>
  </g>
  <text x="120" y="560" fill="#5c5356" font-family="system-ui,sans-serif" font-size="16">Internal deployment package - README infographics</text>
</svg>
