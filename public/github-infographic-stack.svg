<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 168" width="1000" height="168" role="img" aria-labelledby="stitle sdesc">
  <title id="stitle">Aegis Vector architecture stack</title>
  <desc id="sdesc">Flow from Next.js through API layer to data and AI providers</desc>
  <defs>
    <linearGradient id="bgs" x1="0" y1="0" x2="1000" y2="168">
      <stop offset="0%" style="stop-color:#081018"/>
      <stop offset="100%" style="stop-color:#101826"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="168" rx="12" fill="url(#bgs)" stroke="#22d3ee" stroke-opacity="0.2" stroke-width="1"/>
  <text x="500" y="28" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="0.28em">STACK | DATA | AI</text>

  <g font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#e5d9dc">
    <rect x="32" y="48" width="118" height="52" rx="8" fill="#1a1416" stroke="#c4485a" stroke-opacity="0.35"/>
    <text x="91" y="72" text-anchor="middle" font-weight="800" fill="#f5d0d6">Next.js 14</text>
    <text x="91" y="88" text-anchor="middle" font-size="9" fill="#887b7f">App Router</text>

    <text x="168" y="82" fill="#6b5f63" font-size="18">&gt;</text>

    <rect x="192" y="48" width="118" height="52" rx="8" fill="#1a1416" stroke="#3178c6" stroke-opacity="0.45"/>
    <text x="251" y="72" text-anchor="middle" font-weight="800" fill="#9cdcfe">TypeScript</text>
    <text x="251" y="88" text-anchor="middle" font-size="9" fill="#887b7f">Strict types</text>

    <text x="328" y="82" fill="#6b5f63" font-size="18">&gt;</text>

    <rect x="352" y="48" width="130" height="52" rx="8" fill="#1a1416" stroke="#d4a56a" stroke-opacity="0.4"/>
    <text x="417" y="72" text-anchor="middle" font-weight="800" fill="#f0d9a8">Zustand</text>
    <text x="417" y="88" text-anchor="middle" font-size="9" fill="#887b7f">Client state</text>

    <text x="500" y="82" fill="#6b5f63" font-size="18">&gt;</text>

    <rect x="524" y="48" width="138" height="52" rx="8" fill="#1a1416" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="593" y="72" text-anchor="middle" font-weight="800" fill="#a7f3d0">/api/* routes</text>
    <text x="593" y="88" text-anchor="middle" font-size="9" fill="#887b7f">Keys server-only</text>

    <text x="684" y="82" fill="#6b5f63" font-size="18">&gt;</text>

    <rect x="708" y="48" width="260" height="52" rx="8" fill="#1a1416" stroke="#7c3aed" stroke-opacity="0.35"/>
    <text x="838" y="70" text-anchor="middle" font-weight="800" fill="#ddd6fe">Feeds + LLM proxy</text>
    <text x="838" y="88" text-anchor="middle" font-size="8.5" fill="#887b7f">USGS CoinGecko GDELT Ollama Groq Anthropic</text>
  </g>

  <text x="500" y="138" text-anchor="middle" fill="#5c5356" font-family="system-ui,sans-serif" font-size="9">CSP-hardened | Docker standalone optional | Field manual + maps</text>
</svg>
