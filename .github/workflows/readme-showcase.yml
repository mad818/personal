name: README Showcase Capture

on:
  pull_request:
    paths:
      - ".github/workflows/readme-showcase.yml"
      - "scripts/capture-readme-showcase.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      NEXUS_SHOWCASE_CAPTURE_CONFIRM_PUBLIC_STATE: "1"
      NEXUS_NETWORK_MODE: isolated
      NEXUS_ALLOW_PAID_APIS: "false"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
      PORT: "3100"
      HOSTNAME: 127.0.0.1
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production Nexus runtime
        run: npm run build

      - name: Initialize masked one-run token
        shell: bash
        run: |
          token="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$token"
          echo "NEXUS_TOKEN=${token}" >> "$GITHUB_ENV"

      - name: Start isolated Nexus runtime
        shell: bash
        run: |
          npm run start > "$RUNNER_TEMP/nexus-readme-showcase.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/nexus-readme-showcase.pid"
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3100/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/nexus-readme-showcase.log"
          exit 1

      - name: Capture publish-safe COMMAND surface
        run: npm run readme:showcase:capture

      - name: Upload showcase artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-prime-command-showcase
          path: output/playwright/nexus-prime-command-showcase.webp
          if-no-files-found: error
          retention-days: 7

      - name: Stop runtime
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/nexus-readme-showcase.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/nexus-readme-showcase.pid")" 2>/dev/null || true
          fi
