      .skin{fill:url(#skin)}
      .bronze{fill:url(#bronze)}
      .steel{fill:url(#steel)}
      .ember{fill:url(#ember)}
      .aether{fill:url(#aether)}
      .verdant{fill:url(#verdant)}
      .bone{fill:url(#bone)}
      .gloam{fill:url(#gloam)}
      .sky{fill:url(#sky)}
