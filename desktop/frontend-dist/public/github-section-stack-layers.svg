<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="kT kD">
  <title id="kT">Stack layers</title>
  <desc id="kD">Framework through data visualization</desc>
  <defs>
    <linearGradient id="kBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0708"/><stop offset="100%" style="stop-color:#151012"/>
    </linearGradient>
    <linearGradient id="kAc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c4485a"/><stop offset="50%" style="stop-color:#d4a56a"/><stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="430" rx="16" fill="url(#kBg)" stroke="#c4485a" stroke-opacity="0.28" stroke-width="1"/>

  <text x="500" y="30" text-anchor="middle" fill="#e8ddd0" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="800" letter-spacing="0.36em">STACK LAYERS</text>
  <line x1="60" y1="40" x2="940" y2="40" stroke="url(#kAc)" stroke-opacity="0.55" stroke-width="1"/>
  <text x="500" y="54" text-anchor="middle" fill="#6b5f63" font-family="system-ui,sans-serif" font-size="8">Companion to the pipeline strip in At a glance</text>

  <g font-family="system-ui,Segoe UI,sans-serif">
    <rect x="36" y="66" width="128" height="40" rx="8" fill="#1a1416" stroke="#c4485a" stroke-opacity="0.35"/>
    <text x="100" y="90" text-anchor="middle" fill="#fca5a5" font-weight="700" font-size="7">LAYER</text>
    <rect x="172" y="66" width="348" height="40" rx="8" fill="#1a1416" stroke="#60a5fa" stroke-opacity="0.35"/>
    <text x="346" y="90" text-anchor="middle" fill="#93c5fd" font-weight="700" font-size="7">TECH</text>
    <rect x="528" y="66" width="436" height="40" rx="8" fill="#1a1416" stroke="#34d399" stroke-opacity="0.35"/>
    <text x="746" y="90" text-anchor="middle" fill="#6ee7b7" font-weight="700" font-size="7">WHY</text>
  </g>

  <g font-family="system-ui,Segoe UI,sans-serif" font-size="7.2">
    <rect x="36" y="114" width="928" height="30" rx="6" fill="#141011" stroke="#3f3f46"/>
    <text x="100" y="134" text-anchor="middle" fill="#d6d3d1" font-weight="600">Framework</text>
    <text x="346" y="134" text-anchor="middle" fill="#f5f5f4">Next.js 14 (App Router)</text>
    <text x="746" y="134" text-anchor="middle" fill="#a8a29e">File routes, server components, API routes</text>

    <rect x="36" y="148" width="928" height="30" rx="6" fill="#141011" stroke="#3f3f46"/>
    <text x="100" y="168" text-anchor="middle" fill="#d6d3d1" font-weight="600">Language</text>
    <text x="346" y="168" text-anchor="middle" fill="#f5f5f4">TypeScript 5</text>
    <text x="746" y="168" text-anchor="middle" fill="#a8a29e">Types across client and server</text>

    <rect x="36" y="182" width="928" height="30" rx="6" fill="#141011" stroke="#3f3f46"/>
    <text x="100" y="202" text-anchor="middle" fill="#d6d3d1" font-weight="600">State</text>
    <text x="346" y="202" text-anchor="middle" fill="#f5f5f4">Zustand</text>
    <text x="746" y="202" text-anchor="middle" fill="#a8a29e">Persisted settings + session live data</text>

    <rect x="36" y="216" width="928" height="30" rx="6" fill="#141011" stroke="#3f3f46"/>
    <text x="100" y="236" text-anchor="middle" fill="#d6d3d1" font-weight="600">Styling</text>
    <text x="346" y="236" text-anchor="middle" fill="#f5f5f4">Tailwind CSS + Radix UI</text>
    <text x="746" y="236" text-anchor="middle" fill="#a8a29e">Dark design system, accessible primitives</text>

    <rect x="36" y="250" width="928" height="30" rx="6" fill="#141011" stroke="#3f3f46"/>
    <text x="100" y="270" text-anchor="middle" fill="#d6d3d1" font-weight="600">AI</text>
    <text x="346" y="270" text-anchor="middle" fill="#f5f5f4">Claude MiniMax OpenAI chain or Ollama</text>
    <text x="746" y="270" text-anchor="middle" fill="#a8a29e">Cloud or fully offline local</text>

    <rect x="36" y="284" width="928" height="30" rx="6" fill="#141011" stroke="#3f3f46"/>
    <text x="100" y="304" text-anchor="middle" fill="#d6d3d1" font-weight="600">Maps</text>
    <text x="346" y="304" text-anchor="middle" fill="#f5f5f4">Leaflet + react-leaflet</text>
    <text x="746" y="304" text-anchor="middle" fill="#a8a29e">World map + live layers</text>

    <rect x="36" y="318" width="928" height="30" rx="6" fill="#141011" stroke="#3f3f46"/>
    <text x="100" y="338" text-anchor="middle" fill="#d6d3d1" font-weight="600">Motion</text>
    <text x="346" y="338" text-anchor="middle" fill="#f5f5f4">Framer Motion</text>
    <text x="746" y="338" text-anchor="middle" fill="#a8a29e">Tab transitions, panel reveals</text>

    <rect x="36" y="352" width="928" height="30" rx="6" fill="#141011" stroke="#3f3f46"/>
    <text x="100" y="372" text-anchor="middle" fill="#d6d3d1" font-weight="600">Toasts</text>
    <text x="346" y="372" text-anchor="middle" fill="#f5f5f4">Sonner</text>
    <text x="746" y="372" text-anchor="middle" fill="#a8a29e">User feedback</text>

    <rect x="36" y="386" width="928" height="30" rx="6" fill="#141011" stroke="#3f3f46"/>
    <text x="100" y="406" text-anchor="middle" fill="#d6d3d1" font-weight="600">Data viz</text>
    <text x="346" y="406" text-anchor="middle" fill="#f5f5f4">D3 + SVG sparklines</text>
    <text x="746" y="406" text-anchor="middle" fill="#a8a29e">Lightweight inline charts</text>
  </g>
</svg>
