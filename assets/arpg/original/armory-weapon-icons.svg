    <rect class="steel" x="17" y="20" width="14" height="4"/>
  </g>

  <g id="buckler" transform="translate(288 48)">
    <circle class="dark" cx="24" cy="24" r="16"/>
    <circle class="bronze" cx="24" cy="24" r="13"/>
    <circle class="amber" cx="24" cy="24" r="6"/>
    <rect class="steel" x="22" y="13" width="4" height="22"/>
  </g>

  <g id="fist-wrap" transform="translate(0 96)">
    <rect class="bronze" x="15" y="20" width="19" height="16"/>
    <rect class="amber" x="17" y="14" width="5" height="10"/>
    <rect class="amber" x="23" y="12" width="5" height="12"/>
    <rect class="amber" x="29" y="15" width="5" height="9"/>
    <rect class="dark" x="18" y="30" width="15" height="4"/>
  </g>

  <g id="claw" transform="translate(48 96)">
    <polygon class="steel" points="14,36 19,8 23,36"/>
    <polygon class="steel" points="22,38 27,6 31,38"/>
    <polygon class="steel" points="30,36 35,10 38,36"/>
