<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 224" width="1000" height="224" role="img" aria-labelledby="ovT ovD">
  <title id="ovT">Nexus Prime overview</title>
  <desc id="ovD">Self-hosted dashboard, MIT, BYOK, no backend, local dev</desc>
  <defs>
    <linearGradient id="ovBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080608"/><stop offset="55%" style="stop-color:#100c0e"/><stop offset="100%" style="stop-color:#0c0a0f"/>
    </linearGradient>
    <linearGradient id="ovAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c4485a"/><stop offset="50%" style="stop-color:#d4a56a"/><stop offset="100%" style="stop-color:#a8556c"/>
    </linearGradient>
    <radialGradient id="ovGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" style="stop-color:#c4485a;stop-opacity:0.12"/><stop offset="100%" style="stop-color:#000;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="224" rx="16" fill="url(#ovBg)" stroke="url(#ovAccent)" stroke-opacity="0.45" stroke-width="1.2"/>
  <rect width="1000" height="224" rx="16" fill="url(#ovGlow)"/>
  <path d="M 24 24 L 52 24 M 24 24 L 24 52" fill="none" stroke="#c4485a" stroke-opacity="0.35" stroke-width="1"/>
  <path d="M 976 24 L 948 24 M 976 24 L 976 52" fill="none" stroke="#c4485a" stroke-opacity="0.35" stroke-width="1"/>
  <path d="M 24 200 L 52 200 M 24 200 L 24 172" fill="none" stroke="#d4a56a" stroke-opacity="0.3" stroke-width="1"/>
  <path d="M 976 200 L 948 200 M 976 200 L 976 172" fill="none" stroke="#d4a56a" stroke-opacity="0.3" stroke-width="1"/>

  <text x="500" y="42" text-anchor="middle" fill="#e8ddd0" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="800" letter-spacing="0.42em">NEXUS PRIME</text>
  <line x1="120" y1="52" x2="880" y2="52" stroke="url(#ovAccent)" stroke-width="1.2" stroke-opacity="0.55"/>

  <text x="500" y="82" text-anchor="middle" fill="#d4c4b8" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="600">A personal intelligence dashboard on your machine.</text>
  <text x="500" y="104" text-anchor="middle" fill="#9a8b90" font-family="system-ui,Segoe UI,sans-serif" font-size="9.5">Live markets, geopolitics, cyber, maps, optional TradingView, multi-provider AI agent.</text>

  <g font-family="system-ui,Segoe UI,sans-serif" font-size="8.5" fill="#7d7175">
    <rect x="48" y="122" width="210" height="56" rx="8" fill="#120e10" stroke="#34d399" stroke-opacity="0.25"/>
    <text x="153" y="144" text-anchor="middle" fill="#a7f3d0" font-weight="700" font-size="9">MIT</text>
    <text x="153" y="160" text-anchor="middle">No in-app charges</text>
    <text x="153" y="172" text-anchor="middle">Optional BYOK APIs</text>

    <rect x="276" y="122" width="210" height="56" rx="8" fill="#120e10" stroke="#60a5fa" stroke-opacity="0.25"/>
    <text x="381" y="144" text-anchor="middle" fill="#93c5fd" font-weight="700" font-size="9">SELF-HOSTED</text>
    <text x="381" y="160" text-anchor="middle">No cloud backend</text>
    <text x="381" y="172" text-anchor="middle">No database</text>

    <rect x="504" y="122" width="210" height="56" rx="8" fill="#120e10" stroke="#c4485a" stroke-opacity="0.3"/>
    <text x="609" y="144" text-anchor="middle" fill="#f5d0d6" font-weight="700" font-size="9">RUN</text>
    <text x="609" y="160" text-anchor="middle">npm run dev</text>
    <text x="609" y="172" text-anchor="middle">.env.local gitignored</text>

    <rect x="732" y="122" width="220" height="56" rx="8" fill="#120e10" stroke="#d4a56a" stroke-opacity="0.28"/>
    <text x="842" y="144" text-anchor="middle" fill="#f0d9a8" font-weight="700" font-size="9">FIELD MANUAL</text>
    <text x="842" y="160" text-anchor="middle">/resources</text>
    <text x="842" y="172" text-anchor="middle">Curated learning links</text>
  </g>

  <line x1="80" y1="188" x2="920" y2="188" stroke="#44403c" stroke-opacity="0.5" stroke-width="0.8"/>
  <text x="500" y="208" text-anchor="middle" fill="#5c5356" font-family="system-ui,sans-serif" font-size="7">GitHub Social preview: open public/github-social-card.svg in a browser, export PNG ~1280x640, upload in repo Settings</text>
</svg>
