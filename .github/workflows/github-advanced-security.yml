name: GitHub Advanced Security

on:
  workflow_dispatch:
  schedule:
    - cron: "19 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "rust"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        if: matrix.language == 'javascript-typescript'
        run: npm ci

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Build JS/TS
        if: matrix.language == 'javascript-typescript'
        run: npm run type-check

      - name: Install Linux deps for Rust/Tauri scan
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            pkg-config

      - name: Configure pkg-config path
        if: matrix.language == 'rust'
        run: echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"

      - name: Build Rust (Tauri)
        if: matrix.language == 'rust'
        run: |
          cd desktop/src-tauri
          if [ -f Cargo.lock ]; then
            cargo build --locked
          else
            cargo build
          fi

      - name: Perform CodeQL Analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        continue-on-error: true
        uses: github/codeql-action/analyze@v3

  dependency-review:
    # Enable by setting repository variable ENABLE_DEPENDENCY_REVIEW=true
    if: github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
