      .blue { fill: #8ecae6; }
      .green { fill: #90be6d; }
      .violet { fill: #c084fc; }
      .red { fill: #ef4444; }
      .frost { fill: #93c5fd; }
      .poison { fill: #84cc16; }
      .curse { fill: #a855f7; }
      .void { fill: #372554; }
      .line { fill: none; stroke: #150c08; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; }
