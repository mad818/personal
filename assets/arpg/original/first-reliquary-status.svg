<svg xmlns="http://www.w3.org/2000/svg" width="256" height="64" viewBox="0 0 256 64" role="img" aria-labelledby="title desc">
  <title id="title">Aether Reliquary status and FX icons</title>
  <desc id="desc">Project-original warm pixel ARPG status source sheet. Sixteen 32 by 32 frames.</desc>
  <defs>
    <filter id="iconShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#120906" flood-opacity="0.55"/>
    </filter>
    <style>.px{shape-rendering:crispEdges}</style>
  </defs>

  <!-- exposed -->
  <g class="px" filter="url(#iconShadow)" transform="translate(0 0)">
    <circle cx="16" cy="16" r="12" fill="#3a2414"/>
    <path d="M16 5l4 11-4 11-4-11z" fill="#ffd166"/>
  </g>
  <!-- staggered -->
  <g class="px" filter="url(#iconShadow)" transform="translate(32 0)">
    <circle cx="16" cy="16" r="12" fill="#3d3029"/>
    <path d="M9 11h15l-7 5h8l-13 8 4-7H8z" fill="#f4a261"/>
  </g>
  <!-- burn -->
  <g class="px" filter="url(#iconShadow)" transform="translate(64 0)">
    <circle cx="16" cy="16" r="12" fill="#3a1208"/>
    <path d="M16 4l7 11-3 10h-8L9 15z" fill="#f97316"/>
    <path d="M16 10l3 7-2 5h-3l-2-5z" fill="#ffe08a"/>
  </g>
  <!-- bleed -->
  <g class="px" filter="url(#iconShadow)" transform="translate(96 0)">
    <circle cx="16" cy="16" r="12" fill="#3a0808"/>
    <path d="M16 5c6 7 8 11 8 15a8 8 0 0 1-16 0c0-4 2-8 8-15z" fill="#ef4444"/>
  </g>
  <!-- chill -->
  <g class="px" filter="url(#iconShadow)" transform="translate(128 0)">
    <circle cx="16" cy="16" r="12" fill="#0f2538"/>
    <path d="M16 5v22M7 16h18M10 9l12 14M22 9L10 23" stroke="#8ecae6" stroke-width="3"/>
  </g>
  <!-- poison -->
  <g class="px" filter="url(#iconShadow)" transform="translate(160 0)">
    <circle cx="16" cy="16" r="12" fill="#10250f"/>
    <circle cx="12" cy="18" r="5" fill="#84cc16"/>
    <circle cx="20" cy="13" r="6" fill="#22c55e"/>
    <circle cx="21" cy="22" r="3" fill="#bef264"/>
  </g>
  <!-- guard -->
  <g class="px" filter="url(#iconShadow)" transform="translate(192 0)">
    <circle cx="16" cy="16" r="12" fill="#2b2014"/>
    <path d="M16 5l10 4v7c0 7-4 11-10 13C10 27 6 23 6 16V9z" fill="#d8a85c"/>
  </g>
  <!-- haste -->
  <g class="px" filter="url(#iconShadow)" transform="translate(224 0)">
    <circle cx="16" cy="16" r="12" fill="#2b180e"/>
    <path d="M7 18h10l-3 8 11-14H15l3-7z" fill="#ffd166"/>
  </g>

  <!-- ward bloom -->
  <g class="px" filter="url(#iconShadow)" transform="translate(0 32)">
    <circle cx="16" cy="16" r="12" fill="#102033"/>
    <circle cx="16" cy="16" r="7" fill="#8ecae6"/>
    <path d="M16 3v7M16 22v7M3 16h7M22 16h7" stroke="#ffd166" stroke-width="2"/>
  </g>
  <!-- rooted -->
  <g class="px" filter="url(#iconShadow)" transform="translate(32 32)">
    <circle cx="16" cy="16" r="12" fill="#13250f"/>
    <path d="M16 6v16M16 19l-8 7M16 19l8 7M16 13l-8-4M16 13l8-4" stroke="#84cc16" stroke-width="3"/>
  </g>
  <!-- fear -->
  <g class="px" filter="url(#iconShadow)" transform="translate(64 32)">
    <circle cx="16" cy="16" r="12" fill="#20102f"/>
    <path d="M8 15c5-7 11-7 16 0-5 7-11 7-16 0z" fill="#d946ef"/>
    <circle cx="16" cy="15" r="3" fill="#120906"/>
  </g>
  <!-- slow -->
  <g class="px" filter="url(#iconShadow)" transform="translate(96 32)">
    <circle cx="16" cy="16" r="12" fill="#172033"/>
    <path d="M16 6v10l7 5" stroke="#8ecae6" stroke-width="3" fill="none"/>
    <path d="M8 24h16" stroke="#f8fafc" stroke-width="2"/>
  </g>
  <!-- cracked armor -->
  <g class="px" filter="url(#iconShadow)" transform="translate(128 32)">
    <circle cx="16" cy="16" r="12" fill="#2f251d"/>
    <path d="M8 8h16v10l-8 8-8-8z" fill="#9ca3af"/>
    <path d="M17 8l-4 7 5 2-4 9" stroke="#3a2414" stroke-width="2"/>
  </g>
  <!-- mana drain -->
  <g class="px" filter="url(#iconShadow)" transform="translate(160 32)">
    <circle cx="16" cy="16" r="12" fill="#102033"/>
    <path d="M16 5c6 7 8 11 8 15a8 8 0 0 1-16 0c0-4 2-8 8-15z" fill="#2563eb"/>
    <path d="M8 24h16" stroke="#120906" stroke-width="3"/>
  </g>
  <!-- curse -->
  <g class="px" filter="url(#iconShadow)" transform="translate(192 32)">
    <circle cx="16" cy="16" r="12" fill="#220d27"/>
    <path d="M9 8l7 6 7-6-4 9 4 7-7-4-7 4 4-7z" fill="#d946ef"/>
  </g>
  <!-- relic fury -->
  <g class="px" filter="url(#iconShadow)" transform="translate(224 32)">
    <circle cx="16" cy="16" r="12" fill="#3a2414"/>
    <path d="M16 4l11 12-11 12L5 16z" fill="#ffd166"/>
    <circle cx="16" cy="16" r="5" fill="#d946ef"/>
  </g>
</svg>
