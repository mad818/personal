    <rect class="dark" x="10" y="11" width="4" height="5"/>
    <rect class="dark" x="34" y="11" width="4" height="5"/>
    <rect class="amber" x="21" y="40" width="9" height="3"/>
  </g>

  <g id="spear" transform="translate(288 0)">
