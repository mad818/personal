<svg xmlns="http://www.w3.org/2000/svg" width="640" height="192" viewBox="0 0 640 192">
  <defs>
    <linearGradient id="bellroot-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#201306"/>
      <stop offset="0.42" stop-color="#5d3514"/>
      <stop offset="1" stop-color="#071827"/>
    </linearGradient>
    <linearGradient id="warden-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#130d0a"/>
      <stop offset="0.46" stop-color="#3b2115"/>
      <stop offset="1" stop-color="#102436"/>
    </linearGradient>
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="#ffe8a3" stop-opacity="0.95"/>
      <stop offset="0.36" stop-color="#f5a63a" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal-glass" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#b4f4ff" stop-opacity="0.88"/>
      <stop offset="0.38" stop-color="#2a8ba5" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#03111b" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="deep-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

