<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-labelledby="qsTitle qsDesc">
  <title id="qsTitle">Quickstart steps</title>
  <desc id="qsDesc">Clone, install, env file, run dev server, open browser</desc>
  <defs>
    <linearGradient id="qsBg" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0708"/><stop offset="100%" style="stop-color:#120d0f"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="220" rx="14" fill="url(#qsBg)" stroke="#c4485a" stroke-opacity="0.28" stroke-width="1"/>
  <text x="500" y="34" text-anchor="middle" fill="#e8ddd0" font-family="system-ui,sans-serif" font-size="12" font-weight="800" letter-spacing="0.2em">QUICKSTART</text>
  <line x1="60" y1="46" x2="940" y2="46" stroke="#c4485a" stroke-opacity="0.35" stroke-width="1"/>

  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" fill="#c4b4b8">
    <g transform="translate(24,64)">
      <rect width="168" height="132" rx="10" fill="#141011" stroke="#34d399" stroke-opacity="0.35"/>
      <circle cx="24" cy="22" r="14" fill="#34d399" fill-opacity="0.2" stroke="#34d399" stroke-width="1"/>
      <text x="24" y="27" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="800">1</text>
      <text x="84" y="28" text-anchor="middle" fill="#f5d0d6" font-size="10" font-family="system-ui,sans-serif" font-weight="700">CLONE</text>
      <text x="84" y="56" text-anchor="middle">git clone ...</text>
      <text x="84" y="72" text-anchor="middle">cd personal</text>
    </g>
    <g transform="translate(208,64)">
      <rect width="168" height="132" rx="10" fill="#141011" stroke="#60a5fa" stroke-opacity="0.35"/>
      <circle cx="24" cy="22" r="14" fill="#60a5fa" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1"/>
      <text x="24" y="27" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="800">2</text>
      <text x="84" y="28" text-anchor="middle" fill="#dbeafe" font-size="10" font-family="system-ui,sans-serif" font-weight="700">INSTALL</text>
      <text x="84" y="56" text-anchor="middle">npm install</text>
    </g>
    <g transform="translate(392,64)">
      <rect width="168" height="132" rx="10" fill="#141011" stroke="#d4a56a" stroke-opacity="0.4"/>
      <circle cx="24" cy="22" r="14" fill="#d4a56a" fill-opacity="0.2" stroke="#d4a56a" stroke-width="1"/>
      <text x="24" y="27" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="800">3</text>
      <text x="84" y="28" text-anchor="middle" fill="#f0d9a8" font-size="10" font-family="system-ui,sans-serif" font-weight="700">ENV</text>
      <text x="84" y="52" text-anchor="middle">cp .env.example</text>
      <text x="84" y="68" text-anchor="middle">.env.local</text>
      <text x="84" y="92" text-anchor="middle" font-size="8" fill="#887b7f">edit keys</text>
    </g>
    <g transform="translate(576,64)">
      <rect width="168" height="132" rx="10" fill="#141011" stroke="#c4485a" stroke-opacity="0.45"/>
      <circle cx="24" cy="22" r="14" fill="#c4485a" fill-opacity="0.2" stroke="#c4485a" stroke-width="1"/>
      <text x="24" y="27" text-anchor="middle" fill="#fda4af" font-size="11" font-weight="800">4</text>
      <text x="84" y="28" text-anchor="middle" fill="#f5d0d6" font-size="10" font-family="system-ui,sans-serif" font-weight="700">RUN</text>
      <text x="84" y="56" text-anchor="middle">npm run dev</text>
    </g>
    <g transform="translate(760,64)">
      <rect width="216" height="132" rx="10" fill="#141011" stroke="#a78bfa" stroke-opacity="0.4"/>
      <circle cx="24" cy="22" r="14" fill="#a78bfa" fill-opacity="0.2" stroke="#a78bfa" stroke-width="1"/>
      <text x="24" y="27" text-anchor="middle" fill="#ddd6fe" font-size="11" font-weight="800">5</text>
      <text x="120" y="28" text-anchor="middle" fill="#e9e0ff" font-size="10" font-family="system-ui,sans-serif" font-weight="700">OPEN</text>
      <text x="120" y="56" text-anchor="middle">localhost:3000</text>
      <text x="120" y="80" text-anchor="middle" font-size="8" fill="#887b7f">PWA: install</text>
      <text x="120" y="96" text-anchor="middle" font-size="8" fill="#887b7f">from browser</text>
    </g>
  </g>
  <text x="500" y="208" text-anchor="middle" fill="#5c5356" font-family="system-ui,sans-serif" font-size="9">Verify: npm run verify (typecheck + lint + path safety)</text>
</svg>
