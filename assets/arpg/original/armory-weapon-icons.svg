    <rect class="bronze" x="23" y="8" width="4" height="37"/>
    <path class="line" d="M25 10 C38 8 42 15 34 23"/>
    <rect class="steel" x="30" y="12" width="9" height="5"/>
    <rect class="green" x="19" y="23" width="12" height="4"/>
  </g>

  <g id="relic-focus" transform="translate(288 96)">
    <circle class="dark" cx="24" cy="24" r="15"/>
    <circle class="blue" cx="24" cy="24" r="11"/>
    <polygon class="amber" points="24,9 29,24 24,39 19,24"/>
    <rect class="steel" x="13" y="22" width="22" height="4"/>
  </g>
</svg>
