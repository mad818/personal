name: Path Safety

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  check-path-collisions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect path collisions
        run: node scripts/check-path-collisions.js
