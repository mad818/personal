name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 1"

permissions:
  contents: read

jobs:
  repo-secret-scan:
    name: Repo Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan tracked repo
        run: npm run security-scan

      - name: Audit git history
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: npm run security-scan:history
