  <g color="#c9a46a" transform="translate(0 0)"><use href="#card"/><use href="#spear"/></g>
  <g color="#ffd166" transform="translate(256 0)"><use href="#card"/><use href="#spear"/><circle cx="128" cy="236" r="54" fill="none" stroke="#ffd166" stroke-opacity=".35" stroke-width="8"/></g>
  <g color="#d946ef" transform="translate(512 0)"><use href="#card"/><use href="#dagger"/><path d="M56 174 C104 116 152 116 200 174" fill="none" stroke="#d946ef" stroke-opacity=".6" stroke-width="7" filter="url(#glow)"/></g>
  <g color="#8ecae6" transform="translate(768 0)"><use href="#card"/><use href="#spear"/><path d="M76 106 C112 76 144 76 180 106" fill="none" stroke="#8ecae6" stroke-opacity=".65" stroke-width="8" filter="url(#glow)"/></g>
  <g color="#f59e0b" transform="translate(1024 0)"><use href="#card"/><use href="#staff"/><circle cx="140" cy="78" r="62" fill="none" stroke="#f59e0b" stroke-opacity=".55" stroke-width="8" filter="url(#glow)"/></g>
  <g color="#fb7185" transform="translate(1280 0)"><use href="#card"/><use href="#scythe"/><circle cx="128" cy="198" r="100" fill="none" stroke="#fb7185" stroke-opacity=".4" stroke-width="7" filter="url(#glow)"/></g>
  <g color="#d946ef" transform="translate(1536 0)"><use href="#card"/><use href="#flail"/></g>
  <g color="#ffd166" transform="translate(1792 0)"><use href="#card"/><use href="#longBlade"/><path d="M70 128 C105 92 151 92 186 128" fill="none" stroke="#ffd166" stroke-opacity=".45" stroke-width="7"/></g>
</svg>
