name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull request title
        if: github.event_name == 'pull_request'
        env:
          NEXUS_PR_TITLE: ${{ github.event.pull_request.title }}
        run: npm run pr:title:check

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Path safety
        run: npm run check:path-collisions

      - name: Agent runtime eval
        run: npm run eval:agent-runtime:ci

      - name: Handoff doc is up to date
        run: npm run handoff:check
